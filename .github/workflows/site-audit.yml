name: Site dependency audit

on:
  push:
    branches: [main]
    paths: ['site/package.json', 'site/bun.lock', 'site/bunfig.toml', '.github/workflows/site-audit.yml']
  pull_request:
    branches: [main]
    paths: ['site/package.json', 'site/bun.lock', 'site/bunfig.toml', '.github/workflows/site-audit.yml']
  schedule:
    - cron: '41 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-audit-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  audit:
    name: bun audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Restore the Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('site/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install from the lockfile
        working-directory: site
        run: bun install --frozen-lockfile --ignore-scripts
      # 開発用の依存パッケージも対象にする。毎日の定期実行で、新しい勧告も拾う。
      - name: Audit the lockfile against the npm advisory database
        working-directory: site
        run: bun audit
