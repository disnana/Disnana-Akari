name: Publish to crates.io

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check main ancestry and tag version
        shell: bash
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo '::error::The release commit must be in the history of main.'
            exit 1
          fi
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$GITHUB_EVENT_NAME" == 'push' && "$GITHUB_REF" != "refs/tags/v$version" ]]; then
            echo "::error::The release tag must match Cargo.toml (v$version)."
            exit 1
          fi

  ci:
    name: Release CI
    needs: validate
    uses: ./.github/workflows/ci.yml

  audit:
    name: Release dependency audit
    needs: validate
    uses: ./.github/workflows/audit.yml

  publish:
    name: Publish disnana-akari
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    needs: [ci, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: crates-io
      url: https://crates.io/crates/disnana-akari
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Get a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the verified revision
        # Release CI builds the package before the OIDC-enabled job starts.
        run: cargo +stable publish --locked --registry crates-io --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
