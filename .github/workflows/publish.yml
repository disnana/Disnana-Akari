name: Publish to crates.io

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-io-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check main ancestry and tag version
        shell: bash
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo '::error::The release commit must be in the history of main.'
            exit 1
          fi
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$GITHUB_EVENT_NAME" == 'push' && "$GITHUB_REF" != "refs/tags/v$version" ]]; then
            echo "::error::The release tag must match Cargo.toml (v$version)."
            exit 1
          fi
          if ! grep -Fxq "## $version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md must contain a heading for $version."
            exit 1
          fi

  ci:
    name: Release CI
    needs: validate
    uses: ./.github/workflows/ci.yml

  audit:
    name: Release dependency audit
    needs: validate
    uses: ./.github/workflows/audit.yml

  publish:
    name: Publish disnana-akari
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    needs: [ci, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: crates-io
      url: https://crates.io/crates/disnana-akari
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Get a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the verified revision
        # Release CI builds the package before the OIDC-enabled job starts.
        run: cargo +stable publish --locked --registry crates-io --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: Sign the crate and create the GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify the published crate
        id: package
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          package="disnana-akari-$version"
          crate="$package.crate"
          url="https://crates.io/api/v1/crates/disnana-akari/$version"
          agent="Disnana-Akari release (https://github.com/$GITHUB_REPOSITORY)"
          checksum=$(curl --fail --silent --show-error --retry 3 --max-time 30 --user-agent "$agent" "$url" | jq -er '.version.checksum')
          curl --fail --silent --show-error --location --retry 3 --max-time 60 --user-agent "$agent" "$url/download" --output "$crate"
          printf '%s  %s\n' "$checksum" "$crate" > SHA256SUMS
          sha256sum --check SHA256SUMS
          source_commit=$(tar -xOzf "$crate" "$package/.cargo_vcs_info.json" | jq -er '.git.sha1')
          if [[ "$source_commit" != "$(git rev-parse HEAD)" ]]; then
            echo '::error::The published crate was packaged from a different commit.'
            exit 1
          fi
          echo "crate=$crate" >> "$GITHUB_OUTPUT"
      - name: Sign provenance for the published crate
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.crate }}
      - name: Create the GitHub Release with verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CRATE: ${{ steps.package.outputs.crate }}
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          gh attestation verify "$CRATE" --repo "$GITHUB_REPOSITORY" --bundle "$BUNDLE" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish.yml" --source-digest "$(git rev-parse HEAD)"
          cp -- "$BUNDLE" "$CRATE.sigstore.json"
          python3 .github/scripts/release-notes.py > release-notes.md
          latest=(--latest)
          if [[ "${GITHUB_REF_NAME%%+*}" == *-* ]]; then
            latest=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" "$CRATE" SHA256SUMS "$CRATE.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" --verify-tag "${latest[@]}" \
            --title "Disnana Akari $GITHUB_REF_NAME" --notes-file release-notes.md
