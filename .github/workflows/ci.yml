name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all --check
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run tests and documentation examples
        run: cargo +stable test --locked

  package:
    name: Package and minimum Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the Rust version declared in Cargo.toml
        shell: bash
        run: |
          rust_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])')
          rustup toolchain install "$rust_version" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$rust_version" >> "$GITHUB_ENV"
      - name: Restore Cargo registry cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: 'false'
          cache-targets: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and check the distribution archive
        shell: bash
        run: |
          cargo package --locked
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          package="disnana-akari-$version"
          files=$(tar -tzf "target/package/$package.crate")
          grep -Fx "$package/LICENSE" <<< "$files"
          grep -Fx "$package/docs/api.md" <<< "$files"
          if grep -E '(^|/)(playground|\.env)(/|$)' <<< "$files"; then
            echo '::error::The distribution archive includes Playground or an environment file.'
            exit 1
          fi
