name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  # main の push は止めず、PR の古い実行だけを取り消す。
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: '10'
  RUSTUP_MAX_RETRIES: '10'
  # デバッグ情報を省いて、ビルド時間とキャッシュの大きさを抑える。
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all --check
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run tests and documentation examples
        run: cargo +stable test --locked

  package:
    name: Package and minimum Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the Rust version declared in Cargo.toml
        shell: bash
        run: |
          rust_version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["rust-version"])')
          rustup toolchain install "$rust_version" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$rust_version" >> "$GITHUB_ENV"
      - name: Restore Cargo registry cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: 'false'
          cache-targets: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and check the distribution archive
        shell: bash
        run: |
          cargo package --locked
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          package="disnana-akari-$version"
          files=$(tar -tzf "target/package/$package.crate")
          grep -Fx "$package/LICENSE" <<< "$files"
          grep -Fx "$package/docs/api.md" <<< "$files"
          if grep -E '(^|/)(playground|\.env)(/|$)' <<< "$files"; then
            echo '::error::The distribution archive includes Playground or an environment file.'
            exit 1
          fi

  semver:
    name: Public API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the Rust version used by the API checker
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check public API against v0.2.1
        shell: bash
        run: |
          archive="$RUNNER_TEMP/cargo-semver-checks.tar.gz"
          tools="$RUNNER_TEMP/akari-semver-checks"
          mkdir -p "$tools"
          url='https://github.com/obi1kenobi/cargo-semver-checks/releases/download/v0.46.0/cargo-semver-checks-x86_64-unknown-linux-gnu.tar.gz'
          sha256='0a6a79f89a59708862abdbd8b2cff52e0831e97951959dfe2350f62c0f7ae7b6'
          curl --fail --silent --show-error --location --retry 3 --max-time 60 --output "$archive" "$url"
          printf '%s  %s\n' "$sha256" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$tools"
          tool=$(find "$tools" -type f -name cargo-semver-checks -print -quit)
          test -n "$tool"
          export PATH="$(dirname "$tool"):$PATH"
          cargo +1.90.0 semver-checks check-release --baseline-rev v0.3.0 --release-type minor

  deny:
    name: Licenses, bans and sources
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the dependency allowlist
        run: python3 .github/scripts/check-dependencies.py
      # 脆弱性は audit.yml が検査するので、ここではライセンス、重複、取得元だけを見る。
      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check licenses bans sources
          arguments: --locked
