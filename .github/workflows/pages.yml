name: Documentation site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - 'docs/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'CHANGELOG.md'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - 'docs/**'
      - 'Cargo.toml'
      - 'CHANGELOG.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: '0'

jobs:
  build:
    name: Build site and API reference
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        working-directory: site
        # 依存パッケージのインストールスクリプトは実行しない。
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check that the Rust code in the guide compiles
        run: python3 site/tools/check_snippets.py "$RUNNER_TEMP/snippets"
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
      - name: Build the API reference
        run: cargo +stable doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Build the guide
        working-directory: site
        run: |
          cp ../CHANGELOG.md content/reference/changelog.md
          npm run build
      - name: Assemble the site
        run: |
          mkdir _site
          cp -r site/.vitepress/dist/. _site/
          cp -r target/doc _site/api
          rm -f _site/api/.lock
      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
