[package]
name = "disnana-akari"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "An asynchronous Discord bot framework built on Twilight."
repository = "https://github.com/disnana/Disnana-Akari"
readme = "README.md"
license = "MIT"
keywords = ["discord", "bot", "twilight", "framework"]
categories = ["api-bindings", "asynchronous"]
include = ["/src/**", "/examples/**", "/docs/**", "/README.md", "/CHANGELOG.md", "/LICENSE*", "/NOTICE*"]
publish = false

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
http-types = { package = "http", version = "1" }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["macros", "sync"] }
twilight-gateway = "0.18"
twilight-http = "0.18"
twilight-model = "0.18"
twilight-validate = "0.18"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
