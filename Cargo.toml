[package]
name = "disnana-akari"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
description = "An asynchronous Discord bot framework built on Twilight."
repository = "https://github.com/disnana/Disnana-Akari"
readme = "README.md"
license = "MIT"
keywords = ["discord", "bot", "twilight", "framework"]
categories = ["api-bindings", "asynchronous"]
include = ["/src/**", "/tests/**", "/examples/**", "/docs/**", "/README.md", "/CHANGELOG.md", "/SECURITY.md", "/LICENSE*", "/NOTICE*"]
publish = ["crates-io"]

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["alloc", "std"] }
http-types = { package = "http", version = "1" }
# コードでは使わないが、削らないこと。TLS の暗号プロバイダーに `ring` を選ぶための依存で、
# 外すとプロバイダーが 1 つもなくなり、最初の TLS 接続で失敗する。
rustls = { version = "0.23", default-features = false, features = ["ring"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "sync", "time"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
twilight-gateway = "0.18"
twilight-http = "0.18"
twilight-model = "0.18"
twilight-util = { version = "0.18", default-features = false, features = ["permission-calculator"] }
twilight-validate = "0.18"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "test-util"] }

# 設計の規則を、機械が判定できる形にしたもの。理由は DESIGN.md を見る。
# 例外が必要なときは、`#[allow(..., reason = "理由")]` で、理由を必ず書く。
[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
allow_attributes_without_reason = "deny"
too_many_lines = "deny"
